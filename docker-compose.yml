version: '3.8'

services:
  web:
    build: .
    ports:
      - "8085:8085"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.bpvbfnmthbthzvhqiwhh:[YOUR-PASSWORD]@aws-1-ap-south-1.pooler.supabase.com:5432/postgres}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: candlelab_db
      POSTGRES_USER: candlelab_user
      POSTGRES_PASSWORD: candlelab_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
