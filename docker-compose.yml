services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - PORT=8085
    expose:
      - "8085"
    networks:
      - candlelab_net

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - candlelab_net

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - candlelab_net

networks:
  candlelab_net:
    driver: bridge
