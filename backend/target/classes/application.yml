# ============================================================
# THE CANDLE LAB — BACKEND CONFIGURATION
# ============================================================

spring:
  application:
    name: the-candle-lab-backend

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  # ============================================================
  # DATASOURCE (Supabase Cloud PostgreSQL)
  # ============================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&preparedStatementCacheQueries=0}
    username: ${DB_USERNAME:postgres.mtrtegicngubprptfqoi}
    password: ${DB_PASSWORD:Thecandlelab@6264885453}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ============================================================
  # FLYWAY
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  # ============================================================
  # REDIS (Disabled — using simple cache instead)
  # ============================================================
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379

  # ============================================================
  # CACHE (Simple in-memory — no Redis needed)
  # ============================================================
  cache:
    type: simple

  # ============================================================
  # FILE UPLOAD
  # ============================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # ============================================================
  # EMAIL
  # ============================================================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:support.thecandlelab@gmail.com }
    password: ${MAIL_PASSWORD:muhgftgqcipadgxc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ============================================================
# SERVER
# ============================================================
server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt:
  secret: ${JWT_SECRET:ThisIsTheCandleLabSuperSecretKeyForJWTTokenGenerationAndValidation2024}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}    # 24 hours
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

# ============================================================
# CLOUDINARY
# ============================================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: thecandlelab

# ============================================================
# CORS
# ============================================================
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# ============================================================
# SPRINGDOC (SWAGGER)
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  info:
    title: The Candle Lab API
    description: Enterprise Luxury Ecommerce Platform API
    version: 1.0.0

# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    root: INFO
    com.thecandlelab: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/thecandlelab.log

# ============================================================
# ACTUATOR
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
