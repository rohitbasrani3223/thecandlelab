events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security Hardening
    server_tokens off;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip High Performance Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff;

    # 1. Redirect HTTP to HTTPS for thecandlelab.in & admin
    server {
        listen 80;
        server_name thecandlelab.in www.thecandlelab.in admin.thecandlelab.in;
        return 301 https://$host$request_uri;
    }

    # 2. Fallback for Direct IP Access (HTTP)
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 50M;
        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api {
            proxy_pass http://web:8085;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
        }

        # Long-term Immutable Caching for Bundled Static JS & CSS (Vite content-hashed)
        location ~* \.(?:css|js)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Media, images & fonts caching
        location ~* \.(?:jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, no-transform";
            access_log off;
        }

        # Never cache index.html so users always get fresh releases
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # 3. Production HTTPS (SSL) Server with HTTP/2 Multiplexing
    server {
        listen 443 ssl;
        http2 on;
        server_name thecandlelab.in www.thecandlelab.in admin.thecandlelab.in;

        ssl_certificate /etc/letsencrypt/live/thecandlelab.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thecandlelab.in/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 50M;

        # Production Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend SPA Static Files
        root /usr/share/nginx/html;
        index index.html;

        # Laravel API Backend Proxy
        location /api {
            proxy_pass http://web:8085;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90;
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
        }

        # Long-term Immutable Caching for Bundled Static JS & CSS (Vite content-hashed)
        location ~* \.(?:css|js)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Media, images & fonts caching
        location ~* \.(?:jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, no-transform";
            access_log off;
        }

        # Never cache index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Frontend Client-side routes (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
