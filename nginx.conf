events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. Main Customer Domain (thecandlelab.in)
    server {
        listen 80;
        server_name thecandlelab.in www.thecandlelab.in;

        # Block direct /admin route on main domain
        location /admin {
            return 404;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static/ {
            alias /app/backend/static/;
        }
    }

    # 2. Isolated Admin Subdomain (admin.thecandlelab.in)
    server {
        listen 80;
        server_name admin.thecandlelab.in;

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static/ {
            alias /app/backend/static/;
        }
    }
}
