<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B46A" />
      <stop offset="50%" stop-color="#C8A75A" />
      <stop offset="100%" stop-color="#9A7B32" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Candle Flame & Body Icon -->
  <g transform="translate(10, 10)">
    <!-- Base / Candle Pillar -->
    <rect x="18" y="28" width="24" height="32" rx="4" fill="url(#goldGradient)" />
    <!-- Candle Wick -->
    <path d="M 30 28 L 30 20" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" />
    <!-- Outer Flame Glow -->
    <path d="M 30 6 C 22 14 24 22 30 22 C 36 22 38 14 30 6 Z" fill="url(#goldGradient)" filter="url(#glow)" />
    <!-- Inner Flame Core -->
    <path d="M 30 11 C 26 16 27 20 30 20 C 33 20 34 16 30 11 Z" fill="#FFF8E7" />
    <!-- Sparkle Accent -->
    <path d="M 46 12 L 48 16 L 52 18 L 48 20 L 46 24 L 44 20 L 40 18 L 44 16 Z" fill="#C8A75A" opacity="0.9" />
  </g>

  <!-- Typography: THE CANDLE LAB -->
  <text x="75" y="40" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="22" font-weight="700" letter-spacing="3" fill="#1F1F1F">
    THE CANDLE LAB
  </text>

  <!-- Subtitle: ATELIER HOME FRAGRANCES -->
  <text x="76" y="58" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="4" fill="#C8A75A">
    ATELIER HOME FRAGRANCES
  </text>
</svg>
